#
# ptp4l configuration for the AES67 FPGA wallclock (aes67_eth PHC).
# Based on config_tool/ptp4l.conf from the AES67 project, plus the AES67
# media profile transport settings. Started by /etc/init.d/aes67 as
#   ptp4l -f /etc/aes67/ptp4l.conf -i <aes67 interface>
#
[global]
#
# Transport (AES67 media profile: UDP/IPv4, end-to-end delay)
#
network_transport	UDPv4
delay_mechanism		E2E
time_stamping		hardware
#
# Default Data Set
#
clock_servo linreg
twoStepFlag		1
clientOnly		0
socket_priority		0
priority1		10
priority2		128
domainNumber		0
clockClass		248
clockAccuracy		0xFE
offsetScaledLogVariance	0xFFFF
free_running		0
freq_est_interval	1
dscp_event		46
dscp_general		46
dataset_comparison	ieee1588
G.8275.defaultDS.localPriority	128
maxStepsRemoved		255
#
# Port Data Set
#
logAnnounceInterval	1
logSyncInterval		-3
operLogSyncInterval	0
logMinDelayReqInterval	0
logMinPdelayReqInterval	0
operLogPdelayReqInterval 0
announceReceiptTimeout	3
syncReceiptTimeout	0
delay_response_timeout	50
# TX timestamps are read back over SPI by a workqueue that competes with omc
# for the CPU: measured up to ~46 ms with omc running. 100 ms still fits into
# one sync interval (logSyncInterval -3 = 125 ms).
tx_timestamp_timeout	100
delayAsymmetry		0
delay_filter moving_average
delay_filter_length 50
step_threshold 0.005
servo_offset_threshold 200
utc_offset 0
